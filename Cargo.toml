[package]
name = "bot_store_telegram"
version = "0.1.0"
edition = "2024"
authors = ["BotStoreTelegram"]
description = "Telegram Bot & Mini App for Gemini Pro Activation with PayOS VietQR, PostgreSQL Ledger, and AES-256-GCM Security"

[dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }

# Web Framework (Axum) & Middleware
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# Telegram Bot Framework (Pure Rust TLS)
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls"] }

# Database (PostgreSQL + SQLx with Pure Rust TLS)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "migrate", "macros"] }

# HTTP Client (for PayOS API)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization & Validation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.19", features = ["derive"] }
url = "2.5"

# Types & Error Handling
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dotenvy = "0.15"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Security & Cryptography (AES-256-GCM, PayOS & Telegram WebApp HMAC-SHA256)
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
