databases:
  - name: bot-store-postgres
    plan: free
    databaseName: bot_store_telegram
    user: bot_store_user

services:
  - type: web
    name: bot-store-telegram
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: BOT_MODE
        value: webhook
      - key: RUST_LOG
        value: info,bot_store_telegram=info,sqlx=warn
      - key: DB_MAX_CONNECTIONS
        value: "10"
      - key: PAYOS_BASE_URL
        value: https://api-merchant.payos.vn
      - key: REFERRAL_REWARD_VND
        value: "5000"
      - key: DATABASE_URL
        fromDatabase:
          name: bot-store-postgres
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: SUPPORT_HANDLE
        value: "@kim12ad"
      - key: CREDENTIALS_MASTER_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_STRING_SESSION
        sync: false
      - key: PARTNER_BOT_USERNAMES
        sync: false
      - key: SCAN_HISTORY_ON_BOOT
        value: "30"
